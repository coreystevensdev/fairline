name: Deploy to AWS EC2
run-name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  # Deploys follow a green CI on main rather than the merge itself, so a commit
  # whose tests failed never reaches the box.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      force:
        description: Deploy even though CI has not passed for this commit
        type: boolean
        default: false

# One deploy at a time. Two runs for different commits would race on the same
# container name and the box could end up pinned to the older image.
concurrency:
  group: deploy-fairline-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read # reads CI's conclusion for this sha on a manual run

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  deploy:
    # The environment is a second gate the workflow condition cannot bypass:
    # GitHub refuses to run this job for any ref but main, and the OIDC subject
    # becomes environment:production, which is what lets the AWS trust policy
    # stop accepting a bare repo wildcard.
    environment:
      name: production
      url: https://fairline.coreystevens.dev/
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # workflow_run fires for any CI run matching the filter, and CI runs on
    # pull_request. A fork's default branch is also called main, so a fork PR
    # produces a run with head_branch "main" that passes a bare branches filter.
    # Without the event and head_repository checks this job would check out the
    # fork's sha and deploy it with this repo's OIDC credentials.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
       || (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'push'
           && github.event.workflow_run.head_branch == 'main'
           && github.event.workflow_run.head_repository.full_name == github.repository) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A manual run skips the workflow_run gate, so it asks the question that
      # gate answers. Empty is treated as failure: no completed run for this sha
      # is not the same as a green one.
      - name: Check CI passed for this commit
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')
          echo "CI for ${SHA:0:7}: ${conclusion:-none}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for ${SHA:0:7} is '${conclusion:-none}'. Re-run with force checked if that is intended."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: echo "image=${ECR_REPO}:sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # The service listens on loopback only, so the health check has to run on
      # the instance. Deploy and verify are one script: it exits non-zero if the
      # container never answers /health, and this job fails with it.
      - name: Deploy and verify on the instance
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          cat > deploy-remote.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          IMAGE="$1"
          REGION=us-east-1
          REGISTRY=401716295306.dkr.ecr.us-east-1.amazonaws.com

          # Read here rather than passed in, so the URL never appears in the SSM
          # command string, the workflow log, or CloudTrail.
          DATABASE_URL=$(aws ssm get-parameter --name /fairline/database-url \
            --with-decryption --region "$REGION" --query Parameter.Value --output text)

          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE"

          docker stop fairline 2>/dev/null || true
          docker rm fairline 2>/dev/null || true

          # 8082 on loopback: 8080 is bondcalc and 8081 is titlerate on this box.
          # 256m against a measured 139m steady state, on an instance already
          # carrying a JVM. The image runs alembic before uvicorn, so a migration
          # that fails takes the container down rather than serving a stale schema.
          docker run -d \
            --name fairline \
            --restart=always \
            -p 127.0.0.1:8082:8000 \
            --memory=256m \
            --memory-swap=768m \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "FAIRLINE_ENV=production" \
            -e "SITE_URL=https://fairline.coreystevens.dev" \
            "$IMAGE"

          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then
              echo "healthy after $((i * 5))s"

              # Idempotent: it returns without writing when its own rows exist.
              # The pages label these rows as sample data for as long as they are
              # present, so this cannot quietly turn into a performance claim.
              docker exec fairline python -m fairline seed-demo
              exit 0
            fi
            sleep 5
          done
          echo "never answered /health within 120s; last 50 log lines:"
          docker logs --tail 50 fairline
          exit 1
          SCRIPT

          B64=$(base64 -w0 deploy-remote.sh)
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy fairline $IMAGE" \
            --parameters "commands=[\"echo $B64 | base64 -d > /tmp/deploy-fairline.sh\",\"sudo bash /tmp/deploy-fairline.sh $IMAGE\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2

          [ "$STATUS" = "Success" ] || { echo "deploy failed with status $STATUS"; exit 1; }
