name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          ODDS_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: README test count matches what pytest collects
        run: |
          n=$(pytest --collect-only -q | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          grep -q "tests-$n-brightgreen" README.md || {
            echo "pytest collects $n, README badge does not say so. Update it."; exit 1; }
          echo "README agrees with pytest: $n"
        env:
          ODDS_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
